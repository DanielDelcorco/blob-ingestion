receivers:
  otlp:
    protocols:
      grpc:

processors:
  batch: {}

exporters:
  # substitui o antigo "logging"
  debug:
    verbosity: detailed

  # envia spans para o Jaeger via Zipkin
  zipkin:
    endpoint: "http://jaeger:9411/api/v2/spans"

  # expõe métricas em uma porta nova
  prometheus:
    endpoint: "0.0.0.0:8889"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [zipkin, debug]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]